[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mocode"
version = "0.4.0"
description = "Lean agent framework — build custom AI agents with composable tools, prompts, and providers."
requires-python = ">= 3.12"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0.52",
    "questionary>=2.1.1",
    "pyperclip>=1.8",
    "wcwidth>=0.2",
]

[project.scripts]
mocode = "mocode.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
# Optional terminal extras — ``uv sync --group tui``. Without it the CLI
# keeps every behaviour; with it, sealed answer/reasoning blocks render
# their markdown fully (see mocode.cli.markdown).
tui = [
    "rich>=13.0",
]
